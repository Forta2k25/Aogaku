<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青山ハック — ユーザー分布</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --green: #00966C;
    --green-light: #e6f6f1;
    --bg: #f5f7f6;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ─── キー選択画面 ─── */
  #key-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .key-card {
    background: var(--card); border-radius: 18px; padding: 44px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  .key-card .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .logo-dot { width: 36px; height: 36px; background: var(--green); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .key-card h1 { font-size: 20px; font-weight: 700; text-align: left; }
  .key-card .desc { font-size: 13px; color: var(--sub); margin-top: 4px; text-align: left; }
  .drop-zone {
    margin-top: 28px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 36px 20px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--green); background: var(--green-light); }
  .drop-zone .dz-icon { font-size: 36px; margin-bottom: 10px; }
  .drop-zone p { font-size: 14px; color: var(--sub); }
  .drop-zone strong { color: var(--green); }
  #file-input { display: none; }
  .key-note {
    margin-top: 18px; padding: 12px 14px;
    background: #fefce8; border: 1px solid #fde68a; border-radius: 10px;
    font-size: 12px; color: #92400e; text-align: left; line-height: 1.6;
  }
  .error-msg { margin-top: 14px; font-size: 13px; color: #ef4444; min-height: 18px; }

  /* ─── ダッシュボード ─── */
  #dashboard { display: none; }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .hd-left { display: flex; align-items: center; gap: 10px; }
  .hd-logo-dot { width: 30px; height: 30px; background: var(--green); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
  header h2 { font-size: 17px; font-weight: 700; }
  .hd-right { display: flex; align-items: center; gap: 12px; }
  #last-updated { font-size: 12px; color: var(--sub); }
  .btn-sm { padding: 7px 16px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--card); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); transition: border-color 0.2s; }
  .btn-sm:hover { border-color: var(--green); color: var(--green); }
  .btn-sm:disabled { opacity: 0.5; cursor: default; }
  .btn-sub { font-size: 13px; color: var(--sub); cursor: pointer; background: none; border: none; }
  .btn-sub:hover { color: var(--text); }

  main { padding: 28px; max-width: 1100px; margin: 0 auto; }

  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .summary-card { background: var(--card); border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .sc-label { font-size: 12px; color: var(--sub); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .sc-value { font-size: 32px; font-weight: 800; color: var(--green); margin-top: 4px; }
  .sc-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }

  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 700px) { .charts-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
  .chart-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }
  .chart-wrap { position: relative; height: 260px; }

  .table-card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
  .table-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 9px 14px; background: var(--bg); font-size: 12px; color: var(--sub); font-weight: 600; }
  th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .bar-inline { display: inline-block; height: 8px; border-radius: 4px; background: var(--green); vertical-align: middle; margin-right: 8px; opacity: 0.75; }
  .pct { color: var(--sub); font-size: 13px; }

  #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(245,247,246,0.85); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--green-light); border-top-color: var(--green); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay p { font-size: 14px; color: var(--sub); }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <p id="loading-msg">データを読み込んでいます…</p>
</div>

<!-- キー選択画面 -->
<div id="key-screen">
  <div class="key-card">
    <div class="logo">
      <div class="logo-dot">青</div>
      <div style="text-align:left">
        <h1>青山ハック</h1>
        <p class="desc">管理者ダッシュボード</p>
      </div>
    </div>

    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div class="dz-icon">🔑</div>
      <p><strong>サービスアカウントJSONを選択</strong></p>
      <p style="margin-top:6px;font-size:12px">クリックまたはドラッグ＆ドロップ</p>
    </div>
    <input type="file" id="file-input" accept=".json">

    <div class="key-note">
      ⚠️ このファイルは外部に送信されません。ブラウザ内のみで処理されます。<br>
      JSONファイルは安全な場所で管理してください。
    </div>
    <div class="error-msg" id="key-error"></div>
  </div>
</div>

<!-- ダッシュボード -->
<div id="dashboard">
  <header>
    <div class="hd-left">
      <div class="hd-logo-dot">青</div>
      <h2>ユーザー分布</h2>
    </div>
    <div class="hd-right">
      <span id="last-updated"></span>
      <button class="btn-sm" id="refresh-btn" onclick="loadData()">↻ 更新</button>
      <button class="btn-sub" onclick="resetKey()">キーを変更</button>
    </div>
  </header>

  <main>
    <div class="summary-row">
      <div class="summary-card">
        <div class="sc-label">総ユーザー数</div>
        <div class="sc-value" id="total-count">—</div>
        <div class="sc-sub">アカウント作成者</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">学部数</div>
        <div class="sc-value" id="faculty-count">—</div>
        <div class="sc-sub">登録済み学部</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">学科数</div>
        <div class="sc-value" id="dept-count">—</div>
        <div class="sc-sub">登録済み学科</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>📚 学年分布</h3>
        <div class="chart-wrap"><canvas id="grade-chart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>🏫 学部分布</h3>
        <div class="chart-wrap"><canvas id="faculty-chart"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <h3>📊 学部 × 学科 内訳</h3>
      <table>
        <thead><tr><th>学部</th><th>学科</th><th>人数</th><th style="min-width:160px">割合</th></tr></thead>
        <tbody id="dept-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
  const PROJECT_ID = 'forta-aogaku';
  const BASE_URL   = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

  let serviceAccount = null;
  let accessToken    = null;
  let tokenExpiry    = 0;
  let gradeChart = null, facultyChart = null;

  // ─── ファイル読み込み ───────────────────────────────────────
  document.getElementById('file-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) readKeyFile(file);
  });

  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) readKeyFile(file);
  });

  function readKeyFile(file) {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const json = JSON.parse(e.target.result);
        if (!json.client_email || !json.private_key) throw new Error('無効なサービスアカウントJSONです');
        serviceAccount = json;
        document.getElementById('key-error').textContent = '';
        document.getElementById('key-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        await loadData();
      } catch (err) {
        document.getElementById('key-error').textContent = 'JSONの読み込みに失敗しました: ' + err.message;
      }
    };
    reader.readAsText(file);
  }

  function resetKey() {
    serviceAccount = null; accessToken = null; tokenExpiry = 0;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('key-screen').style.display = 'flex';
    document.getElementById('file-input').value = '';
  }

  // ─── JWT → アクセストークン取得 ────────────────────────────
  async function getAccessToken() {
    if (accessToken && Date.now() < tokenExpiry) return accessToken;

    const now = Math.floor(Date.now() / 1000);
    const header  = { alg: 'RS256', typ: 'JWT' };
    const payload = {
      iss:   serviceAccount.client_email,
      scope: 'https://www.googleapis.com/auth/datastore',
      aud:   'https://oauth2.googleapis.com/token',
      exp:   now + 3600,
      iat:   now,
    };

    const b64u = obj => btoa(JSON.stringify(obj)).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const signingInput = `${b64u(header)}.${b64u(payload)}`;

    // 秘密鍵のインポート
    const pem = serviceAccount.private_key.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\n/g, '');
    const keyData = Uint8Array.from(atob(pem), c => c.charCodeAt(0));
    const cryptoKey = await crypto.subtle.importKey(
      'pkcs8', keyData.buffer,
      { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
      false, ['sign']
    );

    const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', cryptoKey, new TextEncoder().encode(signingInput));
    const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
    const jwt = `${signingInput}.${sigB64}`;

    const res = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
    });
    const data = await res.json();
    if (!data.access_token) throw new Error('アクセストークンの取得に失敗しました: ' + JSON.stringify(data));
    accessToken = data.access_token;
    tokenExpiry = Date.now() + 55 * 60 * 1000; // 55分でキャッシュ
    return accessToken;
  }

  // ─── Firestore 全件取得 ────────────────────────────────────
  async function fetchAllUsers() {
    const token = await getAccessToken();
    const users = [];
    let pageToken = null;
    do {
      let url = `${BASE_URL}/users?pageSize=300`;
      if (pageToken) url += `&pageToken=${pageToken}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body?.error?.message || res.statusText);
      }
      const data = await res.json();
      (data.documents || []).forEach(doc => {
        const f = doc.fields || {};
        users.push({
          grade:      f.grade?.integerValue ?? f.grade?.doubleValue ?? null,
          faculty:    f.faculty?.stringValue    || '',
          department: f.department?.stringValue || '',
        });
      });
      pageToken = data.nextPageToken || null;
    } while (pageToken);
    return users;
  }

  // ─── ロード ────────────────────────────────────────────────
  async function loadData() {
    showLoading(true);
    document.getElementById('refresh-btn').disabled = true;
    try {
      const users = await fetchAllUsers();
      render(users);
      document.getElementById('last-updated').textContent =
        `最終更新: ${new Date().toLocaleTimeString('ja-JP')}`;
    } catch (e) {
      alert('データ取得に失敗しました:\n' + e.message);
    } finally {
      showLoading(false);
      document.getElementById('refresh-btn').disabled = false;
    }
  }

  // ─── 描画 ─────────────────────────────────────────────────
  function render(users) {
    const total = users.length;
    document.getElementById('total-count').textContent = total.toLocaleString();

    const gradeMap = {};
    users.forEach(u => {
      const g = u.grade !== null ? Number(u.grade) : null;
      const label = (g >= 1 && g <= 4) ? `${g}年生` : 'その他';
      gradeMap[label] = (gradeMap[label] || 0) + 1;
    });

    const facultyMap = {};
    users.forEach(u => { const f = u.faculty || '未設定'; facultyMap[f] = (facultyMap[f] || 0) + 1; });

    const deptMap = {};
    users.forEach(u => {
      const key = `${u.faculty || '未設定'}__${u.department || '未設定'}`;
      deptMap[key] = (deptMap[key] || 0) + 1;
    });

    document.getElementById('faculty-count').textContent = Object.keys(facultyMap).length;
    document.getElementById('dept-count').textContent = new Set(users.map(u => u.department || '未設定')).size;

    // 学年ドーナツ
    if (gradeChart) gradeChart.destroy();
    gradeChart = new Chart(document.getElementById('grade-chart'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(gradeMap),
        datasets: [{ data: Object.values(gradeMap), backgroundColor: ['#00966C','#22c55e','#86efac','#bbf7d0','#9ca3af'], borderWidth: 2, borderColor: '#fff' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { font: { size: 13 }, boxWidth: 14, padding: 14 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.parsed}人 (${total ? ((ctx.parsed/total)*100).toFixed(1) : 0}%)` } }
        },
        cutout: '60%'
      }
    });

    // 学部横棒
    const palette = ['#00966C','#0ea5e9','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#10b981','#f97316','#6366f1','#14b8a6'];
    const fKeys = Object.keys(facultyMap);
    if (facultyChart) facultyChart.destroy();
    facultyChart = new Chart(document.getElementById('faculty-chart'), {
      type: 'bar',
      data: {
        labels: fKeys,
        datasets: [{ data: Object.values(facultyMap), backgroundColor: fKeys.map((_,i) => palette[i % palette.length]), borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.x}人 (${total ? ((ctx.parsed.x/total)*100).toFixed(1) : 0}%)` } }
        },
        scales: {
          x: { grid: { color: '#f3f4f6' }, ticks: { font: { size: 12 } } },
          y: { grid: { display: false }, ticks: { font: { size: 12 } } }
        }
      }
    });

    // テーブル
    const tbody = document.getElementById('dept-tbody');
    tbody.innerHTML = '';
    const sorted = Object.entries(deptMap).sort((a, b) => b[1] - a[1]);
    const maxVal = sorted.length ? sorted[0][1] : 1;
    sorted.forEach(([key, cnt]) => {
      const [fac, dept] = key.split('__');
      const pct = total ? ((cnt / total) * 100).toFixed(1) : '0.0';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${fac}</td><td>${dept}</td><td><strong>${cnt}</strong> 人</td><td><span class="bar-inline" style="width:${Math.round((cnt/maxVal)*120)}px"></span><span class="pct">${pct}%</span></td>`;
      tbody.appendChild(tr);
    });
  }

  function showLoading(flag) {
    document.getElementById('loading-overlay').style.display = flag ? 'flex' : 'none';
  }
</script>
</body>
</html>
