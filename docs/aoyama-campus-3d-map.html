/* Layout: full-height 3D viewport, building list rail on the left (stacks under on phones), info card floats bottom-left of the viewport */
:root{

  --accent:#00573f; --accent-fg:#ffffff; --scene:#e8ece7; --ground:#dfe5de; --road:#b8bfb9;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --panel:#17211b; --fg:#e6eee8; --muted:#8fa196; --line:#2a3830;
  --accent:#5fd0a0; --accent-fg:#06281b; --scene:#121c16; --ground:#1a261f; --road:#2b352f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713; --panel:#17211b; --fg:#e6eee8; --muted:#8fa196; --line:#2a3830;
  --accent:#5fd0a0; --accent-fg:#06281b; --scene:#121c16; --ground:#1a261f; --road:#2b352f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.02em}
.note{font-size:.72rem;color:var(--muted);margin:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
aside{min-height:0;display:flex;flex-direction:column;gap:8px}
input[type=search]{font:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;min-width:0}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;font-size:.82rem;cursor:pointer;border-bottom:1px solid var(--line)}
li button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
li button:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
li button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
li small{font-family:var(--mono);opacity:.7}
#view{position:relative;min-width:0;min-height:300px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--scene)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.tools button{font:inherit;font-size:.75rem;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#card{position:absolute;left:8px;bottom:8px;max-width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.8rem}
#card h2{margin:0 0 4px;font-size:.95rem}
#card p{margin:0;color:var(--muted);line-height:1.5}
#card .meta{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-bottom:4px}
.compass{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
@media (max-width:720px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(320px,1fr) 150px}
  aside{order:2}
}

  const m=add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,roughness:.8})));m.scale.set(w*.8/Math.SQRT2,1,d*.8/Math.SQRT2);m.position.set(c[0],H+h/2,c[1])};
const STYLES={
  // 法人本部: the ornate stone building in the park; tall windows, dark hip roof
  hojin:styled({w:2.6,F:4.2,roofH:3.5,base:"#b9a68c",bump:3,fl:(r,y,F,k)=>{if(k===0)r(0,y,2.6,1,"#9a8a74","#707070");win(r,.75,y+.9,1.1,F-1.7);r(.65,y+F-.8,1.3,.3,"#d6c8b2","#c0c0c0")},
    top:"#cbbba2",extra:(add,pt,H)=>hipRoof(add,pt,H,3.5,0x5b5552)}),
  // 2号館: historic grey-stone block on 青山通り; pilasters between tall windows
  b2:styled({w:3,F:4.2,base:"#c7c2b6",bump:3,fl:(r,y,F,k)=>{r(0,y,.45,F,"#d8d3c8","#c0c0c0");win(r,.95,y+.8,1.6,F-1.6);if(k===0)r(0,y,3,.8,"#a9a497","#707070")}}),
  // 8号館: precast X-braced frames
  b8:styled({w:4,F:4,base:"#d6d4cf",bump:3,fl:(r,y,F)=>{r(.35,y+.35,3.3,F-.7,"#59626c","#353535");
    for(let t=0;t<=1;t+=.04){r(.35+3.05*t,y+.35+(F-.95)*t,.25,.25,"#e2e0db","#c8c8c8");r(.35+3.05*t,y+F-.6-(F-.95)*t,.25,.25,"#e2e0db","#c8c8c8")}}}),
  // 16号館: slim beige tower with vertical slit windows
  b16:styled({w:1.8,base:"#d9c8ab",fl:(r,y,F)=>r(.65,y+.5,.5,F-1,"#55565a","#353535")}),
  // 11号館: tan tower on 青山通り
  b11:styled({w:2.4,base:"#b59c84",top:"#a38b74",fl:(r,y)=>win(r,.5,y+1,1.4,1.6)}),
  b1:punched,b10:punched,mj:punched,
  bek:ribbon,tK:ribbon,tS:ribbon,tN:ribbon,sk:ribbon,
  // 短大体育館: green roof as seen from above
  tgym:styled({w:3.6,F:6,base:"#e3e3de",roof:0x3f8f5a,fl:(r,y)=>win(r,.3,y+3.5,3,1.6)})};
const CUSTOM={b14:build14,kinen:buildKinen,b17:build17,b15:build15,b18:build18,b7:build7,b3:build3,...STYLES};
const setEm=(m,hex)=>(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.emissive&&x.emissive.setHex(hex));
B.forEach(o=>{
  let big=0,bc=null;
  o.parts.forEach(pt=>{
    if(CUSTOM[o.id]){
      const xs=pt.p.map(a=>a[0]),zs=pt.p.map(a=>a[1]),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...zs)-Math.min(...zs));
      if(area>big){big=area;bc=P((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...zs)+Math.max(...zs))/2)}
      CUSTOM[o.id](o,pt).forEach(m=>{meshes.push(m);(byId[o.id]=byId[o.id]||[]).push(m)});return}
    const pts=pt.p.map(([x,z])=>{const q=P(x,z);return new THREE.Vector2(q[0],-q[1])});
    const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth:pt.h,bevelEnabled:false});g.rotateX(-Math.PI/2);
    const wall=wallPlain();
    const m=new THREE.Mesh(g,o.flat?new THREE.MeshStandardMaterial({color:0xc9b27a,roughness:.9}):[roofMat.clone(),wall]);m.userData=o;scene.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.3})));
    const xs=pt.p.map(a=>a[0]),zs=pt.p.map(a=>a[1]),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...zs)-Math.min(...zs));
    if(area>big){big=area;bc=P((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...zs)+Math.max(...zs))/2)}
    meshes.push(m);(byId[o.id]=byId[o.id]||[]).push(m)});
  const l=label(o.n);l.position.set(bc[0],o.h+4,bc[1]);scene.add(l);labels.push(l)});
const gm=new THREE.MeshLambertMaterial({color:0x56626a});
GATES.forEach(([n,x,z])=>{const q=P(x,z);
  const b=new THREE.Mesh(new THREE.BoxGeometry(8,3,3),gm);b.position.set(q[0],1.5,q[1]);scene.add(b);
  const l=label(n);l.position.set(q[0],8,q[1]);scene.add(l);labels.push(l)});
{const q=P(519,326),l=label("ロータリー");l.position.set(q[0],4,q[1]);scene.add(l);labels.push(l);
 const q2=P(520,560),l2=label("メインストリート(イチョウ並木)");l2.position.set(q2[0],4,q2[1]);scene.add(l2);labels.push(l2)}

const sel={ms:null,id:null};
const card=document.getElementById("card"),list=document.getElementById("list");
function pick(id){
  const ms=byId[id];if(!ms)return;const o=ms[0].userData;
  if(sel.ms)sel.ms.forEach(m=>setEm(m,0));
  sel.ms=ms;sel.id=id;ms.forEach(m=>setEm(m,0x0b2f22));
  card.innerHTML=`<div class="meta">高さ 約${Math.round(o.h)}m(PLATEAU実測)</div><h2>${o.n}</h2><p>国土交通省 PLATEAU の3D都市モデルに基づく形状と高さです。</p>`;
  list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
  const c=new THREE.Box3().setFromObject(ms[0]).getCenter(new THREE.Vector3());
  ctl.target.set(c.x,0,c.z);
}
function render(filter=""){
  list.innerHTML="";
  B.filter(o=>o.n.includes(filter)).forEach(o=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.dataset.id=o.id;b.setAttribute("aria-pressed",sel.id===o.id);
    b.innerHTML=`<span>${o.n}</span><small>${Math.round(o.h)}m</small>`;b.onclick=()=>pick(o.id);li.append(b);list.append(li)})}
render();document.getElementById("q").oninput=e=>render(e.target.value.trim());

const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let down=null;
R.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const r=R.domElement.getBoundingClientRect();
  pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(pt,cam);const hit=ray.intersectObjects(meshes)[0];
  if(hit)pick(hit.object.userData.id)});

const bIso=document.getElementById("bIso"),bTop=document.getElementById("bTop"),bLab=document.getElementById("bLab");
function setView(top){
  bIso.setAttribute("aria-pressed",!top);bTop.setAttribute("aria-pressed",top);
  ctl.target.set(0,0,0);
  top?cam.position.set(0,520,1):cam.position.set(0,300,400);
}
bIso.onclick=()=>setView(false);bTop.onclick=()=>setView(true);
bLab.onclick=()=>{const on=bLab.getAttribute("aria-pressed")!=="true";bLab.setAttribute("aria-pressed",on);labels.forEach(l=>l.visible=on)};
function size(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(view);size();setView(false);
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();
</script>
