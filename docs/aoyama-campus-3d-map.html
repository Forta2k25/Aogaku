<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height 3D viewport, building list rail on the left (stacks under on phones), info card floats bottom-left of the viewport */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --fg:#1b2420; --muted:#66706a; --line:#dcdcd5;
  --accent:#00573f; --accent-fg:#ffffff;
  --sky-top:#c9d9e6; --sky-bot:#eef0ec; --ground:#e3e1da; --site:#ecebe5; --road:#5e6266; --walk:#d6d3cb;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#18201c; --fg:#e7ece9; --muted:#93a19a; --line:#2b3631;
  --accent:#5fd0a0; --accent-fg:#06281b;
  --sky-top:#0d1621; --sky-bot:#2a333a; --ground:#3a403d; --site:#474d49; --road:#2a2d30; --walk:#5a5e5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#18201c; --fg:#e7ece9; --muted:#93a19a; --line:#2b3631;
  --accent:#5fd0a0; --accent-fg:#06281b;
  --sky-top:#0d1621; --sky-bot:#2a333a; --ground:#3a403d; --site:#474d49; --road:#2a2d30; --walk:#5a5e5b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.2rem;margin:0;font-weight:700;letter-spacing:.04em}
.note{font-size:.72rem;color:var(--muted);margin:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
aside{min-height:0;display:flex;flex-direction:column;gap:8px}
input[type=search]{font:inherit;font-size:.85rem;padding:9px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;min-width:0}
ul{list-style:none;margin:0;padding:4px;overflow:auto;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;font-size:.82rem;cursor:pointer;border-radius:6px}
li button:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
li button:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
li button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
li small{font-family:var(--mono);opacity:.65}
#view{position:relative;min-width:0;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sky-bot)}
#view>canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{font:500 11px/1 var(--font);padding:5px 9px;border-radius:999px;white-space:nowrap;pointer-events:auto;cursor:pointer;
  background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--fg);border:1px solid var(--line);
  box-shadow:0 1px 4px rgba(0,0,0,.12);backdrop-filter:blur(4px);transition:background .15s,color .15s}
.tag:hover{border-color:var(--accent)}
.tag.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tag.place{background:none;border:none;box-shadow:none;backdrop-filter:none;pointer-events:none;color:var(--fg);opacity:.75;
  font-size:10.5px;letter-spacing:.08em;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg)}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.tools button{font:inherit;font-size:.75rem;padding:7px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#card{position:absolute;left:10px;bottom:10px;z-index:2;max-width:min(300px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:.8rem;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#card h2{margin:0 0 4px;font-size:.95rem}
#card p{margin:0;color:var(--muted);line-height:1.55}
#card .meta{font-family:var(--mono);font-size:.68rem;color:var(--accent);margin-bottom:4px}
.compass{position:absolute;right:12px;bottom:10px;z-index:2;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
@media (max-width:720px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(340px,1fr) 150px}
  aside{order:2}
  .compass{display:none}
}
</style>

  const H=36,F=4;

const CUSTOM={b14:build14,kinen:buildKinen,b17:build17,b15:build15,b18:build18,b7:build7,b3:build3,...STYLES};

// ---- labels (HTML, crisp at any zoom); short names drop the parenthetical
function tag(text,cls,pos,id){const d=document.createElement("div");d.className="tag "+cls;d.textContent=text;
  if(id)d.onclick=()=>pick(id);const o=new CSS2DObject(d);o.position.copy(pos);scene.add(o);labels.push(o);return o}
const tagOf={};
B.forEach(o=>{
  let big=0,bc=null;
  o.parts.forEach(pt=>{
    const xs=pt.p.map(a=>a[0]),zs=pt.p.map(a=>a[1]),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...zs)-Math.min(...zs));
    if(area>big){big=area;bc=P((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...zs)+Math.max(...zs))/2)}
    let ms;
    if(CUSTOM[o.id])ms=CUSTOM[o.id](o,pt);
    else{const g=new THREE.ExtrudeGeometry(new THREE.Shape(pt.p.map(([x,z])=>{const q=P(x,z);return new THREE.Vector2(q[0],-q[1])})),{depth:pt.h,bevelEnabled:false});g.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:o.flat?0xb79a72:0xdcdbd5,roughness:.9}));m.userData=o;city.add(m);ms=[m]}
    ms.forEach(m=>{meshes.push(m);(byId[o.id]=byId[o.id]||[]).push(m)})});

city.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});

scene.traverse(o=>(Array.isArray(o.material)?o.material:o.material?[o.material]:[]).forEach(m=>{if("envMapIntensity" in m)m.envMapIntensity=inCity.has(o)?.22:0}));
const gm=new THREE.MeshStandardMaterial({color:0x4d5459,roughness:.6,metalness:.3});
GATES.forEach(([n,x,z])=>{const q=P(x,z);
  for(const s of [-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,3.2,1.2),gm);p.position.set(q[0]+s*4,1.6,q[1]);p.castShadow=true;scene.add(p)}
  tag(n,"place",new THREE.Vector3(q[0],5,q[1]))});
tag("ロータリー","place",new THREE.Vector3(P(519,326)[0],3,P(519,326)[1]));
tag("メインストリート","place",new THREE.Vector3(P(520,600)[0],3,P(520,600)[1]));
tag("中央の広場","place",new THREE.Vector3(P(430,420)[0],3,P(430,420)[1]));
tag("青山通り(国道246号)","place",new THREE.Vector3(P(300,800)[0],2,P(300,800)[1]));

// ---- selection, camera moves
const sel={id:null},card=document.getElementById("card"),list=document.getElementById("list");
const setEm=(m,on)=>(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>{if(x.emissive){x.emissive.setHex(on?0x1f7a58:0);x.emissiveIntensity=on?.28:1}});
let fly=null;
function flyTo(t,p,ms=900){fly={t0:performance.now(),ms,a:{t:ctl.target.clone(),p:cam.position.clone()},b:{t,p}};redraw()}
function pick(id){
  const ms=byId[id];if(!ms)return;const o=ms[0].userData;
  if(sel.id){byId[sel.id].forEach(m=>setEm(m,0));tagOf[sel.id].element.classList.remove("on")}
  sel.id=id;ms.forEach(m=>setEm(m,1));tagOf[id].element.classList.add("on");
  card.innerHTML=`<div class="meta">高さ 約${Math.round(o.h)}m(PLATEAU実測)</div><h2>${o.n}</h2><p>国土交通省 PLATEAU の3D都市モデルに基づく形状と高さです。</p>`;
  list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
  const box=new THREE.Box3();ms.forEach(m=>box.expandByObject(m));const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
  const dir=cam.position.clone().sub(ctl.target).normalize(),dist=Math.max(sz.x,sz.y,sz.z)*2.2+45;
  c.y=sz.y*.35;flyTo(c,c.clone().add(dir.multiplyScalar(dist)));redraw()}
function renderList(filter=""){
  list.innerHTML="";
  B.filter(o=>o.n.includes(filter)).forEach(o=>{

    b.dataset.id=o.id;b.setAttribute("aria-pressed",sel.id===o.id);

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
const hit=e=>{const r=R.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,cam);return ray.intersectObjects(meshes,false)[0]};
R.domElement.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];fly=null});
R.domElement.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const h=hit(e);if(h)pick(h.object.userData.id)});
R.domElement.addEventListener("pointermove",e=>{if(e.buttons)return;R.domElement.style.cursor=hit(e)?"pointer":"grab"});

const bIso=document.getElementById("bIso"),bTop=document.getElementById("bTop"),bLab=document.getElementById("bLab");
function setView(top,ms=900){
  bIso.setAttribute("aria-pressed",!top);bTop.setAttribute("aria-pressed",top);
  const t=new THREE.Vector3(10,0,25);flyTo(t,top?new THREE.Vector3(10,620,26):new THREE.Vector3(-150,185,320),ms)}
bIso.onclick=()=>setView(false);bTop.onclick=()=>setView(true);
bLab.onclick=()=>{const on=bLab.getAttribute("aria-pressed")!=="true";bLab.setAttribute("aria-pressed",on);labels.forEach(l=>l.visible=on);redraw()};
function size(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h,false);composer.setSize(w,h);L2.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();redraw()}
ctl.addEventListener("change",redraw);
new ResizeObserver(size).observe(view);size();
ctl.target.set(10,0,25);cam.position.set(-150,185,320);
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
(function loop(now){requestAnimationFrame(loop);
  if(fly){const k=Math.min(1,(now-fly.t0)/fly.ms),e=ease(k);ctl.target.lerpVectors(fly.a.t,fly.b.t,e);cam.position.lerpVectors(fly.a.p,fly.b.p,e);if(k===1)fly=null;dirty=true}
  if(ctl.update())dirty=true;
  if(dirty){dirty=false;composer.render();L2.render(scene,cam)}})(performance.now());
window.__map={R,scene,cam,ctl,composer,redraw};   // handle for debugging in the console
</script>
