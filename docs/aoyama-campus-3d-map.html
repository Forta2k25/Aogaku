<title>青山キャンパス3Dマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height 3D viewport, building list rail on the left (stacks under on phones), info card floats bottom-left of the viewport */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --fg:#17231d; --muted:#5d6b63; --line:#d5dcd6;
  --accent:#00573f; --accent-fg:#ffffff; --scene:#e8ece7; --ground:#dfe5de; --road:#b8bfb9;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --panel:#17211b; --fg:#e6eee8; --muted:#8fa196; --line:#2a3830;
  --accent:#5fd0a0; --accent-fg:#06281b; --scene:#121c16; --ground:#1a261f; --road:#2b352f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713; --panel:#17211b; --fg:#e6eee8; --muted:#8fa196; --line:#2a3830;
  --accent:#5fd0a0; --accent-fg:#06281b; --scene:#121c16; --ground:#1a261f; --road:#2b352f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.02em}
.note{font-size:.72rem;color:var(--muted);margin:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
aside{min-height:0;display:flex;flex-direction:column;gap:8px}
input[type=search]{font:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;min-width:0}
ul{list-style:none;margin:0;padding:0;overflow:auto;flex:1;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;font-size:.82rem;cursor:pointer;border-bottom:1px solid var(--line)}
li button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
li button:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
li button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
li small{font-family:var(--mono);opacity:.7}
#view{position:relative;min-width:0;min-height:300px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--scene)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.tools button{font:inherit;font-size:.75rem;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#card{position:absolute;left:8px;bottom:8px;max-width:min(300px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:.8rem}
#card h2{margin:0 0 4px;font-size:.95rem}
#card p{margin:0;color:var(--muted);line-height:1.5}
#card .meta{font-family:var(--mono);font-size:.7rem;color:var(--accent);margin-bottom:4px}
.compass{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
@media (max-width:720px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(320px,1fr) 150px}
  aside{order:2}
}
</style>

<header>
  <h1>青山キャンパス 3Dマップ</h1>
  <p class="note">形状・高さは国土交通省PLATEAU(渋谷区2023年度)に基づきます。</p>
</header>
<main>
  <aside>
    <input id="q" type="search" placeholder="建物を検索" aria-label="建物を検索">
    <ul id="list"></ul>
  </aside>
  <div id="view">
    <div class="tools">
      <button id="bIso" aria-pressed="true">斜め</button>
      <button id="bTop" aria-pressed="false">真上</button>
      <button id="bLab" aria-pressed="true">名称</button>
    </div>
    <div id="card"><div class="meta">出典: 国土交通省 Project PLATEAU / ドラッグで回転 / ホイールで拡大</div><h2>建物を選んでください</h2><p>一覧または3D上の建物をタップすると詳細が出ます。</p></div>
    <div class="compass">上=マップ上側 / 下=青山通り</div>
  </div>
</main>

<script>

const B=[{"id":"b17","n":"17号館","h":65.5,"parts":[{"p":[[268,590],[268,650],[314,650],[314,638],[317,638],[318,627],[318,491],[268,491],[268,590]],"h":65.5},{"p":[[320,558],[320,571],[332,571],[332,559],[320,558]],"h":10},{"p":[[336,641],[336,654],[355,654],[407,654],[408,489],[336,489],[336,531],[321,531],[321,534],[319,534],[318,551],[337,551],[337,566],[333,566],[332,608],[336,608],[336,641]],"h":44.8}]},{"id":"b18","n":"18号館(マクレイ記念館)","h":41.8,"parts":[{"p":[[215,436],[216,481],[306,478],[305,424],[286,424],[287,434],[215,436]],"h":31.0},{"p":[[288,363],[289,388],[303,387],[302,362],[288,363]],"h":10},{"p":[[190,357],[194,483],[207,483],[204,357],[190,357]],"h":30.9},{"p":[[303,387],[289,388],[217,389],[217,412],[272,411],[272,421],[344,419],[344,410],[371,410],[370,385],[303,387]],"h":41.8}]},{"id":"kinen","n":"青山学院記念館(大学体育館)","h":22.8,"parts":[{"p":[[111,513],[111,541],[110,600],[109,688],[238,689],[239,569],[240,511],[224,511],[224,502],[209,502],[150,503],[124,503],[124,508],[111,508],[111,513]],"h":22.8}]},{"id":"b11","n":"11号館","h":33.4,"parts":[{"p":[[633,546],[625,545],[623,658],[627,658],[627,667],[651,668],[651,664],[652,588],[656,588],[656,575],[660,575],[660,565],[662,565],[663,551],[666,551],[666,534],[656,533],[656,521],[640,520],[639,546],[633,546]],"h":33.4},{"p":[[638,512],[618,512],[619,522],[619,526],[625,527],[625,545],[633,546],[633,529],[638,529],[638,512]],"h":17.1}]},{"id":"b7","n":"7号館","h":17.9,"parts":[{"p":[[260,680],[260,711],[386,710],[386,720],[444,720],[462,720],[462,664],[382,664],[383,675],[383,679],[260,680]],"h":17.9}]},{"id":"hojin","n":"法人本部","h":17.1,"parts":[{"p":[[406,297],[405,334],[405,337],[405,351],[404,372],[448,373],[448,365],[452,364],[453,362],[455,359],[454,356],[451,353],[449,352],[448,329],[458,329],[458,318],[450,318],[449,296],[454,296],[453,276],[435,276],[433,258],[421,258],[421,268],[416,268],[416,277],[406,277],[406,297]],"h":17.1}]},{"id":"b1","n":"1号館","h":19.3,"parts":[{"p":[[431,522],[431,658],[482,65 ],"h":21.3}]},{"id":"b8","n":"8号館","h":39.2,"parts":[{"p":[[602,268],[598,369],[658,372],[657,382],[666,382],[666,389],[723,392],[723,377],[720,377],[724,302],[719,301],[719,295],[696,269],[678,268],[678,279],[638,277],[638,270],[602,268]],"h":39.2}]},{"id":"tgym","n":"短大体育館","h":24.4,"parts":[{"p":[[492,0],[456,57],[528,104],[536,92],[547,99],[571,62],[564,47],[492,0]],"h":24.4}]},{"id":"tN","n":"短大N(北)校舎","h":26.5,"parts":[{"p":[[300,121],[276,106],[271,113],[238,91],[244,82],[220,67],[215,75],[201,67],[197,74],[190,84],[184,93],[205,107],[211,97],[224,106],[240,116],[232,129],[235,132],[252,142],[258,132],[295,156],[285,170],[331,200],[336,192],[359,207],[354,214],[389,236],[423,182],[388,160],[380,173],[300,121]],"h":26.5},{"p":[[235,136],[222,158],[346,236],[354,223],[270,170],[282,152],[275,148],[269,157],[235,136]],"h":16.5},{"p":[[333,46],[330,44],[291,102],[270,88],[264,98],[276,106],[300,121],[345,53],[345,53],[334,46],[333,46]],"h":13.3}]},{"id":"sk","n":"スコーンメーカー記念館","h":7.7,"parts":[{"p":[[138,203],[132,211],[162,230],[179,204],[182,206],[214,156],[222,144],[198,129],[161,187],[136,171],[122,193],[138,203]],"h":7.7}]},{"id":"terr","n":"テラス","h":1.5,"parts":[{"p":[[346,422],[420,422],[420,476],[346,476]],"h":1.5}],"flat":1}];
const GATES=[["正門",520,758],["記念館門",205,758],["東門",60,497],["西門",770,415]];
const view=document.getElementById("view");
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,1,1500);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
view.prepend(R.domElement);
const ctl=new THREE.OrbitControls(cam,R.domElement);
ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI/2.05;ctl.minDistance=30;ctl.maxDistance=900;
scene.add(new THREE.HemisphereLight(0xffffff,0x778877,.85));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(-80,200,150);scene.add(sun);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const groundMat=new THREE.MeshLambertMaterial(),roadMat=new THREE.MeshLambertMaterial();
function flat(poly,mat,y){
  const sh=new THREE.Shape(poly.map(([x,z])=>{const q=P(x,z);return new THREE.Vector2(q[0],-q[1])}));
  const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),mat);m.rotation.x=-Math.PI/2;m.position.y=y;scene.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,420),groundMat);ground.rotation.x=-Math.PI/2;scene.add(ground);
flat(rect(-300,745,1100,860),roadMat,.1);                 // 青山通り
const pm=new THREE.MeshLambertMaterial({color:0xc9c3b4});
[rect(512,380,528,748),rect(90,250,102,748),rect(218,255,470,268),rect(90,740,760,752),rect(60,490,153,504),
 rect(556,372,740,384),rect(100,497,270,510),rect(724,400,790,420)].forEach(r=>flat(r,pm,.2));
const rot=new THREE.Mesh(new THREE.CircleGeometry(46*S,48),new THREE.MeshLambertMaterial({color:0xd3e26d}));
rot.rotation.x=-Math.PI/2;rot.position.set(...[P(519,326)[0],.3,P(519,326)[1]]);scene.add(rot);
function theme(){scene.background=new THREE.Color(css("--scene"));groundMat.color.set(css("--ground"));roadMat.color.set(css("--road"))}
theme();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>setTimeout(theme,50));
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function label(text){
  const c=document.createElement("canvas"),g=c.getContext("2d");
  g.font="bold 34px sans-serif";const w=Math.ceil(g.measureText(text).width)+24;c.width=w;c.height=52;
  g.font="bold 34px sans-serif";g.textBaseline="middle";g.lineWidth=7;g.strokeStyle="rgba(0,0,0,.75)";g.strokeText(text,12,27);g.fillStyle="#fff";g.fillText(text,12,27);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(w/12,52/12,1);s.renderOrder=10;return s}
const meshes=[],labels=[],byId={};
B.forEach(o=>{
  let big=0,bc=null;
  o.parts.forEach(pt=>{
    const pts=pt.p.map(([x,z])=>{const q=P(x,z);return new THREE.Vector2(q[0],-q[1])});
    const g=new THREE.ExtrudeGeometry(new THREE.Shape(pts),{depth:pt.h,bevelEnabled:false});g.rotateX(-Math.PI/2);
    const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:o.flat?0xc9b27a:0x3a9e85}));m.userData=o;scene.add(m);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.3})));
    const xs=pt.p.map(a=>a[0]),zs=pt.p.map(a=>a[1]),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...zs)-Math.min(...zs));
    if(area>big){big=area;bc=P((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...zs)+Math.max(...zs))/2)}
    meshes.push(m);(byId[o.id]=byId[o.id]||[]).push(m)});
  const l=label(o.n);l.position.set(bc[0],o.h+4,bc[1]);scene.add(l);labels.push(l)});
const gm=new THREE.MeshLambertMaterial({color:0x56626a});
GATES.forEach(([n,x,z])=>{const q=P(x,z);
  const b=new THREE.Mesh(new THREE.BoxGeometry(8,3,3),gm);b.position.set(q[0],1.5,q[1]);scene.add(b);
  const l=label(n);l.position.set(q[0],8,q[1]);scene.add(l);labels.push(l)});
{const q=P(519,326),l=label("ロータリー");l.position.set(q[0],4,q[1]);scene.add(l);labels.push(l);
 const q2=P(520,560),l2=label("メインストリート(イチョウ並木)");l2.position.set(q2[0],4,q2[1]);scene.add(l2);labels.push(l2)}

const sel={ms:null,id:null};
const card=document.getElementById("card"),list=document.getElementById("list");
function pick(id){
  const ms=byId[id];if(!ms)return;const o=ms[0].userData;
  if(sel.ms)sel.ms.forEach(m=>m.material.emissive.setHex(0));
  sel.ms=ms;sel.id=id;ms.forEach(m=>m.material.emissive.setHex(0x1f6b4f));
  card.innerHTML=`<div class="meta">高さ 約${Math.round(o.h)}m(PLATEAU実測)</div><h2>${o.n}</h2><p>国土交通省 PLATEAU の3D都市モデルに基づく形状と高さです。</p>`;
  list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
  const c=new THREE.Box3().setFromObject(ms[0]).getCenter(new THREE.Vector3());
  ctl.target.set(c.x,0,c.z);
}
function render(filter=""){
  list.innerHTML="";
  B.filter(o=>o.n.includes(filter)).forEach(o=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.dataset.id=o.id;b.setAttribute("aria-pressed",sel.id===o.id);
    b.innerHTML=`<span>${o.n}</span><small>${Math.round(o.h)}m</small>`;b.onclick=()=>pick(o.id);li.append(b);list.append(li)})}
render();document.getElementById("q").oninput=e=>render(e.target.value.trim());

const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let down=null;
R.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;
  const r=R.domElement.getBoundingClientRect();
  pt.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(pt,cam);const hit=ray.intersectObjects(meshes)[0];
  if(hit)pick(hit.object.userData.id)});

const bIso=document.getElementById("bIso"),bTop=document.getElementById("bTop"),bLab=document.getElementById("bLab");
function setView(top){
  bIso.setAttribute("aria-pressed",!top);bTop.setAttribute("aria-pressed",top);
  ctl.target.set(0,0,0);
  top?cam.position.set(0,520,1):cam.position.set(0,300,400);
}
bIso.onclick=()=>setView(false);bTop.onclick=()=>setView(true);
bLab.onclick=()=>{const on=bLab.getAttribute("aria-pressed")!=="true";bLab.setAttribute("aria-pressed",on);labels.forEach(l=>l.visible=on)};
function size(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(view);size();setView(false);
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();
</script>
