<title>青山キャンパス3Dマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height 3D viewport, building list rail on the left (stacks under on phones), info card floats bottom-left of the viewport */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --fg:#1b2420; --muted:#66706a; --line:#dcdcd5;
  --accent:#00573f; --accent-fg:#ffffff;
  --sky-top:#c9d9e6; --sky-bot:#eef0ec; --ground:#e3e1da; --site:#ecebe5; --road:#5e6266; --walk:#d6d3cb;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif; --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#18201c; --fg:#e7ece9; --muted:#93a19a; --line:#2b3631;
  --accent:#5fd0a0; --accent-fg:#06281b;
  --sky-top:#0d1621; --sky-bot:#2a333a; --ground:#3a403d; --site:#474d49; --road:#2a2d30; --walk:#5a5e5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#18201c; --fg:#e7ece9; --muted:#93a19a; --line:#2b3631;
  --accent:#5fd0a0; --accent-fg:#06281b;
  --sky-top:#0d1621; --sky-bot:#2a333a; --ground:#3a403d; --site:#474d49; --road:#2a2d30; --walk:#5a5e5b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.2rem;margin:0;font-weight:700;letter-spacing:.04em}
.ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.seg button{font:inherit;font-size:.78rem;border:0;background:none;color:var(--fg);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:.72rem;color:var(--muted);margin:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
aside{min-height:0;display:flex;flex-direction:column;gap:8px}
input[type=search]{font:inherit;font-size:.85rem;padding:9px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;min-width:0}
ul{list-style:none;margin:0;padding:4px;overflow:auto;flex:1;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;font-size:.82rem;cursor:pointer;border-radius:6px}
li button:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
li button:focus-visible,.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
li button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
li small{font-family:var(--mono);opacity:.65}
#view{position:relative;min-width:0;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sky-bot)}
#view>canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{font:500 11px/1 var(--font);padding:5px 9px;border-radius:999px;white-space:nowrap;pointer-events:auto;cursor:pointer;
  background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--fg);border:1px solid var(--line);
  box-shadow:0 1px 4px rgba(0,0,0,.12);backdrop-filter:blur(4px);transition:background .15s,color .15s}
.tag:hover{border-color:var(--accent)}
.tag.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tag.place{background:none;border:none;box-shadow:none;backdrop-filter:none;pointer-events:none;color:var(--fg);opacity:.75;
  font-size:10.5px;letter-spacing:.08em;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg)}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.tools button{font:inherit;font-size:.75rem;padding:7px 11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;cursor:pointer}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#card{position:absolute;left:10px;bottom:10px;z-index:2;max-width:min(300px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:.8rem;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#card h2{margin:0 0 4px;font-size:.95rem}
#card p{margin:0;color:var(--muted);line-height:1.55}
#card .meta{font-family:var(--mono);font-size:.68rem;color:var(--accent);margin-bottom:4px}
.compass{position:absolute;right:12px;bottom:10px;z-index:2;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
@media (max-width:720px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(340px,1fr) 150px}
  aside{order:2}
  .compass{display:none}
}
</style>

<header>
  <div class="ttl"><h1 id="ttl">青山キャンパス 3Dマップ</h1>
    <div class="seg" role="group" aria-label="キャンパス切り替え"><button data-c="aoyama" aria-pressed="true">青山</button><button data-c="sagamihara" aria-pressed="false">相模原</button></div></div>
  <p class="note" id="note"></p>
</header>
<main>
  <aside>
    <input id="q" type="search" placeholder="建物を検索" aria-label="建物を検索">
    <ul id="list"></ul>
  </aside>
  <div id="view">
    <div class="tools">
      <button id="bIso" aria-pressed="true">斜め</button>
      <button id="bTop" aria-pressed="false">真上</button>
      <button id="bLab" aria-pressed="true">名称</button>
    </div>
    <div id="card"><div class="meta">ドラッグで回転 / 右ドラッグで移動 / ホイールで拡大</div><h2>建物を選んでください</h2><p>一覧または3D上の建物・名称をタップすると、その建物へ移動します。</p></div>
    <div class="compass" id="compass"></div>
  </div>
</main>

  sB:cream({pil:1}),sD:cream(),sE:cream(),sF:cream({pil:1}),sG:cream(),sL:cream({pil:1}),sK:cream({pil:1}),sJ:cream({pil:1}),
  sI:cream(),sN:cream(),sO:cream(),sM:cream(),sS:cream(),
  sC:buildChapel,
  sP:styled({w:4,F:6,roofH:3,base:"#e8e3d6",roof:0xd8d8d4,fl:(r,y)=>win(r,.4,y+3,3.2,1.6),extra:(add,pt,H)=>vault(add,pt,H,0xe9ebec)}),            // 屋内練習場: barrel roof
  sV:styled({w:3,F:4,base:"#dcd8cf",roof:0xbfbdb6,fl:(r,y)=>win(r,.3,y+1,2.4,1.6)}),                                                      // スタジアムのスタンド
  sH:cream({roof:0xc8a49c}),sR:cream({roof:0xc8a49c})};                                                                                      // pinkish roofs seen in the video
function groundSagamihara(){
  plane(4000,4000,0,0,0,M.ground);
  flat(SG.site,M.site,.02);
  {const g=[];for(const [x,y,w,h] of SG_PATHS){const a=P(x,y),b=P(x+w,y+h);g.push(new THREE.PlaneGeometry(b[0]-a[0],b[1]-a[1]).rotateX(-Math.PI/2).translate((a[0]+b[0])/2,0,(a[1]+b[1])/2))}
   const m=new THREE.Mesh(mergeGeometries(g),M.path);m.position.y=.06;m.receiveShadow=true;groundG.add(m)}
  // 相模原グラウンド: lawn, running track with turf infield, tennis courts
  flat(SG.yellow[0],M.lawn,.05);
  const oval=(rx,ry)=>{const a=rx-ry,s=new THREE.Shape();s.moveTo(-a,-ry);s.lineTo(a,-ry);s.absarc(a,0,ry,-Math.PI/2,Math.PI/2);s.lineTo(-a,ry);s.absarc(-a,0,ry,Math.PI/2,Math.PI*1.5);return s};
  const at=(shape,x,y,mat,h)=>{const q=P(x,y),m=new THREE.Mesh(new THREE.ShapeGeometry(shape,48),mat);m.rotation.x=-Math.PI/2;m.position.set(q[0],h,q[1]);m.receiveShadow=true;groundG.add(m);return m};
  at(oval(85*S,44*S),300,52,M.track,.07);at(oval(85*S-9,44*S-9),300,52,M.turf,.09);
  for(let i=0;i<5;i++)flat(rect(300+i*24,100,320+i*24,124),M.court2,.07);
  // ガーデン: lawn with a pond
  flat(SG.yellow[1],M.lawn,.05);
  {const e=new THREE.Shape();e.absellipse(0,0,16,10,0,Math.PI*2);at(e,395,262,M.water,.09).rotation.z=.5}
  // スタジアム field: artificial turf with pitch lines
  flat(SG_FIELD,M.turf,.065);                                             // drawn over the path layer (the map paints it road-grey)
  {const g=[],a=P(96,356),b=P(176,480),ln=(w,d,x,z)=>g.push(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2).translate(x,0,z));
   ln(b[0]-a[0],.15,(a[0]+b[0])/2,a[1]);ln(b[0]-a[0],.15,(a[0]+b[0])/2,b[1]);ln(b[0]-a[0],.15,(a[0]+b[0])/2,(a[1]+b[1])/2);ln(.15,b[1]-a[1],a[0],(a[1]+b[1])/2);ln(.15,b[1]-a[1],b[0],(a[1]+b[1])/2);
   const m=new THREE.Mesh(mergeGeometries(g),M.line);m.position.y=.11;groundG.add(m)}
  // JR横浜線 along the slanted east edge: ballast and two tracks
  {const a=P(387,-60),b=P(578,560),dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz),n=[dz/L,-dx/L],off=12,ang=-Math.atan2(dz,dx),cx=(a[0]+b[0])/2+n[0]*off,cz=(a[1]+b[1])/2+n[1]*off;
   const bal=new THREE.Mesh(new THREE.BoxGeometry(L,.35,10),gmat({color:0x8b8780}));bal.rotation.y=ang;bal.position.set(cx,.17,cz);bal.receiveShadow=true;groundG.add(bal);
   const g=[];for(const t of [-2.2,2.2])for(const r of [-.75,.75])g.push(new THREE.BoxGeometry(L,.18,.12).translate(0,0,t+r));
   const rails=new THREE.Mesh(mergeGeometries(g),new THREE.MeshStandardMaterial({color:0x6d6c69,roughness:.4,metalness:.7}));rails.rotation.y=ang;rails.position.set(cx,.42,cz);groundG.add(rails);
   tag("JR横浜線","place",new THREE.Vector3(cx-n[0]*0+dx*.12,2,cz+dz*.12))}
  // trees: a belt along the campus edge, clusters in the courtyards, a ring round the garden
  const inRects=(x,y)=>SG_PATHS.some(([rx,ry,w,h])=>x>=rx-1&&x<=rx+w+1&&y>=ry-1&&y<=ry+h+1);
  const blocked=(x,y)=>onBuilding(x,y,4)||SG.yellow.some(p=>inPoly(x,y,p))||inPoly(x,y,SG_FIELD)||!inPoly(x,y,SG.site);
  let seed=21;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,belt=[],yard=[];
  const sp=SG.site,cx0=sp.reduce((s,p)=>s+p[0],0)/sp.length,cy0=sp.reduce((s,p)=>s+p[1],0)/sp.length;
  for(let i=0;i<sp.length;i++){const a=sp[i],b=sp[(i+1)%sp.length],L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    for(let t=0;t<L;t+=11){let x=a[0]+(b[0]-a[0])*t/L,y=a[1]+(b[1]-a[1])*t/L;const k=7/Math.hypot(cx0-x,cy0-y);x+=(cx0-x)*k;y+=(cy0-y)*k;
      if(!blocked(x,y)&&!inRects(x,y))belt.push([x,y,.8+rnd()*.35])}}
  for(let x=60;x<560;x+=14)for(let y=0;y<540;y+=14){const px=x+(rnd()-.5)*8,py=y+(rnd()-.5)*8;if(rnd()<.72||blocked(px,py)||inRects(px,py))continue;yard.push([px,py,.7+rnd()*.4])}
  const g1=SG.yellow[1],gx=g1.reduce((s,p)=>s+p[0],0)/g1.length,gy=g1.reduce((s,p)=>s+p[1],0)/g1.length;
  for(const p of g1){const x=p[0]+(p[0]-gx)*.12,y=p[1]+(p[1]-gy)*.12;if(rnd()<.6&&!onBuilding(x,y,3))yard.push([x,y,.9+rnd()*.3])}
  forest(belt,blob([[0,5.6,0,2.6],[1.4,5,.6,2],[-1.3,5.2,-.7,2.1],[.3,7,-.3,1.9]]),[.27,.38,.3,.06],3.2);
  forest(yard,blob([[0,6,0,2.8],[1.5,5.3,.6,2.1],[-1.4,5.5,-.7,2.2],[.3,7.6,-.3,2]]),[.29,.42,.32,.06],3.4)}


// ---- labels (HTML, crisp at any zoom); short names drop the parenthetical
function tag(text,cls,pos,id){const d=document.createElement("div");d.className="tag "+cls;d.textContent=text;
  if(id)d.onclick=()=>pick(id);const o=new CSS2DObject(d);o.position.copy(pos);o.visible=labelsOn;root.add(o);labels.push(o);return o}
let labelsOn=true;


// ---- campuses: data, ground builder, labels and default camera per campus
const CAMPUS={
  aoyama:{title:"青山キャンパス 3Dマップ",note:"形状・高さは国土交通省PLATEAU(渋谷区2023年度)に基づきます。外観は航空写真を参考に再現。",compass:"手前 = 青山通り",
    S:.425,o:[406,400],B:B_AOYAMA,custom:CUSTOM_AOYAMA,ground:groundAoyama,gates:GATES_AOYAMA,shadow:230,
    hsrc:"PLATEAU実測",desc:"国土交通省 PLATEAU の3D都市モデルに基づく形状と高さです。",
    places:[["ロータリー",519,326,3],["メインストリート",520,600,3],["中央の広場",430,420,3],["青山通り(国道246号)",300,800,2]],
    view:{t:[10,0,25],iso:[-150,185,320],top:[10,620,26]}},
  sagamihara:{title:"相模原キャンパス 3Dマップ",note:"形状は公式キャンパスマップ、高さ・外観は航空写真とキャンパスイラストからの推定です。",compass:"手前 = 正門",
    S:.85,o:[300,280],B:SG.B,custom:CUSTOM_SG,ground:groundSagamihara,gates:[["正門",288,534],["東門",60,300]],shadow:300,
    hsrc:"写真から推定",desc:"形状は公式キャンパスマップから、高さは航空写真からの推定です。",
    places:[["相模原グラウンド",300,52,3],["ガーデン",405,240,3],["スタジアム",136,420,3]],
    view:{t:[0,0,10],iso:[-170,300,450],top:[0,760,11]}}};
let campus=CAMPUS.aoyama;
const tagOf={};
function clearRoot(){
  const keep=new Set(Object.values(M));
  root.traverse(o=>{if(o.geometry)o.geometry.dispose();
    (Array.isArray(o.material)?o.material:o.material?[o.material]:[]).forEach(m=>{if(keep.has(m))return;for(const k in m)if(m[k]&&m[k].isTexture)m[k].dispose();m.dispose()})});
  root.clear();meshes.length=0;labels.length=0;for(const k in byId)delete byId[k];for(const k in tagOf)delete tagOf[k];sel.id=null}
function buildCampus(c){
const o0=c.o;S=c.S;P=(x,y)=>[(x-o0[0])*S,(y-o0[1])*S];B=c.B;CUSTOM=c.custom;
city=new THREE.Group();groundG=new THREE.Group();root.add(city,groundG);
c.ground();
B.forEach(o=>{
  let big=0,bc=null;
  o.parts.forEach(pt=>{
    const xs=pt.p.map(a=>a[0]),zs=pt.p.map(a=>a[1]),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...zs)-Math.min(...zs));
    if(area>big){big=area;bc=P((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...zs)+Math.max(...zs))/2)}
    let ms;
    if(CUSTOM[o.id])ms=CUSTOM[o.id](o,pt);
    else{const g=new THREE.ExtrudeGeometry(new THREE.Shape(pt.p.map(([x,z])=>{const q=P(x,z);return new THREE.Vector2(q[0],-q[1])})),{depth:pt.h,bevelEnabled:false});g.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:o.flat?0xb79a72:0xdcdbd5,roughness:.9}));m.userData=o;city.add(m);ms=[m]}
    ms.forEach(m=>{meshes.push(m);(byId[o.id]=byId[o.id]||[]).push(m)})});
  tagOf[o.id]=tag(o.n.replace(/\(.+\)$/,""),"",new THREE.Vector3(bc[0],o.h+5,bc[1]),o.id)});
city.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true}});
// the room environment is only for reflections on buildings; ground and trees get none so the sun's shadows read
const inCity=new Set();city.traverse(o=>inCity.add(o));
root.traverse(o=>(Array.isArray(o.material)?o.material:o.material?[o.material]:[]).forEach(m=>{if("envMapIntensity" in m)m.envMapIntensity=inCity.has(o)?.22:0}));
const gm=new THREE.MeshStandardMaterial({color:0x4d5459,roughness:.6,metalness:.3});
c.gates.forEach(([n,x,z])=>{const q=P(x,z);
  for(const s of [-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(1.2,3.2,1.2),gm);p.position.set(q[0]+s*4,1.6,q[1]);p.castShadow=true;root.add(p)}
  tag(n,"place",new THREE.Vector3(q[0],5,q[1]))});
c.places.forEach(([n,x,y,h])=>{const q=P(x,y);tag(n,"place",new THREE.Vector3(q[0],h,q[1]))});
Object.assign(sun.shadow.camera,{left:-c.shadow,right:c.shadow,top:c.shadow,bottom:-c.shadow});sun.shadow.camera.updateProjectionMatrix()}

// ---- selection, camera moves
const sel={id:null},card=document.getElementById("card"),list=document.getElementById("list");
const setEm=(m,on)=>(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>{if(x.emissive){x.emissive.setHex(on?0x1f7a58:0);x.emissiveIntensity=on?.28:1}});
let fly=null;
function flyTo(t,p,ms=900){fly={t0:performance.now(),ms,a:{t:ctl.target.clone(),p:cam.position.clone()},b:{t,p}};redraw()}
function pick(id){
  const ms=byId[id];if(!ms)return;const o=ms[0].userData;
  if(sel.id){byId[sel.id].forEach(m=>setEm(m,0));tagOf[sel.id].element.classList.remove("on")}
  sel.id=id;ms.forEach(m=>setEm(m,1));tagOf[id].element.classList.add("on");
  card.innerHTML=`<div class="meta">高さ 約${Math.round(o.h)}m(${campus.hsrc})</div><h2>${o.n}</h2><p>${campus.desc}</p>`;
  list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
  const box=new THREE.Box3();ms.forEach(m=>box.expandByObject(m));const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
  const dir=cam.position.clone().sub(ctl.target).normalize(),dist=Math.max(sz.x,sz.y,sz.z)*2.2+45;
  c.y=sz.y*.35;flyTo(c,c.clone().add(dir.multiplyScalar(dist)));redraw()}
function renderList(filter=""){
  list.innerHTML="";
  B.filter(o=>o.n.includes(filter)).forEach(o=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.dataset.id=o.id;b.setAttribute("aria-pressed",sel.id===o.id);
    b.innerHTML=`<span>${o.n}</span><small>${Math.round(o.h)}m</small>`;b.onclick=()=>pick(o.id);li.append(b);list.append(li)})}
renderList();document.getElementById("q").oninput=e=>renderList(e.target.value.trim());

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
const hit=e=>{const r=R.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,cam);return ray.intersectObjects(meshes,false)[0]};
R.domElement.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];fly=null});
R.domElement.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const h=hit(e);if(h)pick(h.object.userData.id)});
R.domElement.addEventListener("pointermove",e=>{if(e.buttons)return;R.domElement.style.cursor=hit(e)?"pointer":"grab"});

const bIso=document.getElementById("bIso"),bTop=document.getElementById("bTop"),bLab=document.getElementById("bLab");
function setView(top,ms=900){
  bIso.setAttribute("aria-pressed",!top);bTop.setAttribute("aria-pressed",top);
  const v=campus.view,t=new THREE.Vector3(...v.t),p=new THREE.Vector3(...(top?v.top:v.iso));
  if(ms)flyTo(t,p,ms);else{fly=null;ctl.target.copy(t);cam.position.copy(p);ctl.update();redraw()}}
bIso.onclick=()=>setView(false);bTop.onclick=()=>setView(true);
bLab.onclick=()=>{labelsOn=bLab.getAttribute("aria-pressed")!=="true";bLab.setAttribute("aria-pressed",labelsOn);labels.forEach(l=>l.visible=labelsOn);redraw()};
function size(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h,false);composer.setSize(w,h);L2.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();redraw()}
ctl.addEventListener("change",redraw);
new ResizeObserver(size).observe(view);size();
const cardIntro=card.innerHTML;
function switchCampus(key){
  if(!CAMPUS[key])key="aoyama";campus=CAMPUS[key];
  clearRoot();buildCampus(campus);
  document.getElementById("ttl").textContent=campus.title;document.getElementById("note").textContent=campus.note;document.getElementById("compass").textContent=campus.compass;
  document.title=campus.title.replace(" 3Dマップ","3Dマップ");
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===key));
  card.innerHTML=cardIntro;document.getElementById("q").value="";renderList();setView(false,0);
  try{localStorage.setItem("campus",key)}catch(e){}
  if(location.hash!=="#"+key)history.replaceState(null,"","#"+key)}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>switchCampus(b.dataset.c));
let first=location.hash.slice(1);if(!CAMPUS[first]){try{first=localStorage.getItem("campus")}catch(e){first=null}}
switchCampus(first||"aoyama");
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
(function loop(now){requestAnimationFrame(loop);
  if(fly){const k=Math.min(1,(now-fly.t0)/fly.ms),e=ease(k);ctl.target.lerpVectors(fly.a.t,fly.b.t,e);cam.position.lerpVectors(fly.a.p,fly.b.p,e);if(k===1)fly=null;dirty=true}
  if(ctl.update())dirty=true;
  if(dirty){dirty=false;composer.render();L2.render(scene,cam)}})(performance.now());
window.__map={R,scene,cam,ctl,composer,redraw};   // handle for debugging in the console
</script>
